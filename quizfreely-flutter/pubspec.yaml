name: quizfreely_flutter
description: "QuizFreely - Free and open source studying tool for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  uuid: ^4.4.2
  intl: ^0.19.0
  flutter_staggered_animations: ^1.1.1
  flip_card: ^0.7.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
